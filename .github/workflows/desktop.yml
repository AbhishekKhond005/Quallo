name: Desktop packages

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install desktop and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm xauth xvfb
      - name: Test offline workflows
        run: xvfb-run -a -s "-screen 0 1600x1024x24" ./scripts/test.sh --desktop
      - name: Build Linux packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version=1.1.0
          ./scripts/package-linux.sh "$version"
      - name: Install DEB and verify the native launcher
        run: |
          sudo apt-get install -y ./dist/*.deb
          test -f /usr/share/applications/quallo.desktop
          if find dist -maxdepth 1 -name '*.rpm' | grep -q .; then
            rpm_file=$(find dist -maxdepth 1 -name '*.rpm' -print -quit)
            rpm -qpl "$rpm_file" > build/rpm-files.txt
            grep -qx '/usr/share/applications/quallo.desktop' build/rpm-files.txt
            grep -qx '/opt/quallo/bin/Quallo' build/rpm-files.txt
          fi
          xvfb-run -a bash -e -c '
            data="$(mktemp -d)"
            /opt/quallo/bin/Quallo --data-dir "$data" &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for attempt in {1..40}; do
              if [[ -s "$data/workspace.xml" ]]; then
                grep -q "<quallo " "$data/workspace.xml"
                if grep -Eq "<(workspace|card)( |>)" "$data/workspace.xml"; then
                  echo "Fresh install contains project items." >&2
                  exit 1
                fi
                exit 0
              fi
              kill -0 "$app_pid"
              sleep .25
            done
            echo "Quallo did not start from the installed DEB." >&2
            exit 1
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Windows packages
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.Substring(1) } else { "1.1.0" }
          ./scripts/package-windows.ps1 -Version $version
      - name: Test Windows workspace storage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/tests | Out-Null
          javac --release 21 -encoding UTF-8 -cp build/classes -d build/tests src/test/java/quallo/StoreTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp "build/classes;build/tests" quallo.StoreTest
          exit $LASTEXITCODE
      - name: Install MSI and verify the native launcher
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist -Filter *.msi | Select-Object -First 1).FullName
          $installRoot = Join-Path $env:RUNNER_TEMP "quallo-installed"
          $installLog = Join-Path $env:RUNNER_TEMP "quallo-msi.log"
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$installLog`" INSTALLDIR=`"$installRoot`"" -PassThru -Wait
          if ($result.ExitCode -ne 0) {
            Get-Content $installLog -Tail 80
            throw "Quallo MSI exited with code $($result.ExitCode)."
          }
          $candidatePaths = @(
            (Join-Path $installRoot "Quallo.exe"),
            (Join-Path $env:LOCALAPPDATA "Quallo/Quallo.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs/Quallo/Quallo.exe"),
            (Join-Path $env:ProgramFiles "Quallo/Quallo.exe")
          )
          $launcher = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$launcher) {
            Get-Content $installLog | Select-String "INSTALLDIR|APPLICATIONFOLDER"
            throw "Installed Quallo.exe was not located."
          }
          $data = Join-Path $env:RUNNER_TEMP "quallo-native-smoke"
          $manifest = Join-Path $data "workspace.xml"
          $app = Start-Process $launcher -ArgumentList "--data-dir `"$data`"" -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60 -and !(Test-Path $manifest); $attempt++) {
              if ($app.HasExited) { throw "Quallo exited before opening the workspace." }
              Start-Sleep -Milliseconds 250
            }
            if (!(Test-Path $manifest)) { throw "Quallo did not initialize local storage." }
            [xml]$workspace = Get-Content $manifest -Raw
            if ($workspace.DocumentElement.Name -ne "quallo" -or $workspace.DocumentElement.GetAttribute("selected") -ne "" -or
                $workspace.SelectNodes("/quallo/workspace | /quallo/inbox//card").Count -ne 0) {
              throw "Fresh install contains project items."
            }
          } finally {
            if (!$app.HasExited) {
              if ($app.CloseMainWindow()) { $app.WaitForExit(3000) | Out-Null }
              if (!$app.HasExited) { $app.Kill() }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Quallo $GITHUB_REF_NAME" --generate-notes
          fi
